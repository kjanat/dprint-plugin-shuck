name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugin
          path: artifact
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: deno task verify-release "${RELEASE_TAG}"
      - name: Generate release notes
        run: deno task release-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" artifact/plugin.wasm artifact/schema.json \
            --verify-tag --title "${RELEASE_TAG}" --generate-notes \
            --notes-file artifact/release-notes.md
