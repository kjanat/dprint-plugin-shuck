name: Release
run-name: Release ${{ github.ref_name }}
on: { push: { tags: ["[0-9]+.[0-9]+.[0-9]+"] } }
permissions: { contents: read }
jobs:
  validate: { uses: $/.github/workflows/ci.yml }
  release:
    needs: validate
    runs-on: ubuntu-latest
    if: github.repository == 'kjanat/dprint-plugin-shuck'
    permissions: { contents: write }
    env: { ref_name: "${{ github.ref_name }}", download_dir: artifact }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with: { name: plugin, path: "${{ env.download_dir }}" }
          - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: run verify-release "${ref_name}"
      - run: run release-notes
      - name: "Publish release ${{ github.ref_name }}"
        env: { GH_TOKEN: "${{ github.token }}" }
        working-directory: ${{ env.download_dir }}
        run: gh release create "${ref_name}" --verify-tag --title "${ref_name}"
          --generate-notes --notes-file release-notes.md
          plugin.wasm schema.json
