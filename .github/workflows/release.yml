name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Target plugin version, for example 0.1.4
        required: true
        type: string

permissions: { contents: read, id-token: write }

jobs:
  start:
    if: github.repository == 'kjanat/dprint-plugin-shuck'
    runs-on: ubuntu-26.04
    steps:
      - uses: kjanat/beepboop/actions/release@e7d916f27126cc7e47af904e8888cfb9b180c8e4 # v1
        with: { stream: main, version: "${{ inputs.version }}" }
